<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1422"/>
      <stop offset="1" stop-color="#101d31"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b3a5b"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#9fb6cf"/>
    </linearGradient>
    <style>
      .h1{fill:#f3f7fc;font-size:38px;font-weight:700}
      .sub{fill:#8fa7c4;font-size:19px}
      .panel{fill:#15233a;stroke:#26405f;stroke-width:1.5;rx:14}
      .ph{fill:#cfe0f5;font-size:24px;font-weight:700}
      .pnum{fill:#3fd0a0;font-size:24px;font-weight:700}
      .lbl{fill:#e6eefb;font-size:19px;font-weight:600}
      .txt{fill:#9fb4d0;font-size:17px}
      .badge{font-size:14px;font-weight:700}
      .ok{fill:#3fd0a0;font-size:19px;font-weight:700}
      .no{fill:#5d7494;font-size:19px;font-weight:700}
      .mid{fill:#e8b84b;font-size:19px;font-weight:700}
      .cell{fill:#c3d3ea;font-size:16px}
      .row0{fill:#cfe0f5;font-size:16px;font-weight:700}
      .foot{fill:#7d93b2;font-size:15px}
      .chip{fill:#1d3350;stroke:#2f4d72;stroke-width:1}
      .arrow{stroke:#3fd0a0;stroke-width:2.5;fill:none;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3fd0a0"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="104" fill="url(#hdr)"/>
  <rect x="0" y="100" width="1600" height="4" fill="#3fd0a0"/>
  <text x="40" y="50" class="h1">Wysokorozdzielczy teren 3D — GUGiK NMT 1 m (LiDAR PL)</text>
  <text x="40" y="84" class="sub">MapaTur · .NET 10 MAUI · SKGLView / OpenGL ES 3.0 · rdzeń obliczeniowy w C# (TDD)</text>
  <rect x="1320" y="30" width="240" height="44" rx="22" class="chip"/>
  <text x="1440" y="59" text-anchor="middle" class="badge" fill="#3fd0a0">~30× WIĘCEJ DETALU</text>

  <!-- ============ PANEL 01 — DANE ============ -->
  <rect x="40" y="130" width="745" height="455" rx="14" class="panel"/>
  <text x="68" y="178" class="pnum">01</text>
  <text x="108" y="178" class="ph">Skąd dane</text>

  <!-- Source 1 -->
  <rect x="68" y="200" width="688" height="78" rx="10" fill="#16304a" stroke="#2f6b52" stroke-width="1.5"/>
  <rect x="68" y="200" width="6" height="78" rx="3" fill="#3fd0a0"/>
  <text x="92" y="228" class="lbl">GUGiK NMT 1 m — lotniczy skaning laserowy (ALS)</text>
  <text x="92" y="252" class="txt">DTM, siatka 1 m, surowe wysokości (GeoTIFF / WCS). Pokrycie: cała Polska.</text>
  <rect x="636" y="210" width="108" height="26" rx="13" fill="#1f5c43"/>
  <text x="690" y="228" text-anchor="middle" class="badge" fill="#7df0c4">PRIMARY · PL</text>

  <!-- Source 2 -->
  <rect x="68" y="290" width="688" height="78" rx="10" fill="#1a2942" stroke="#3a4d6b" stroke-width="1.5"/>
  <rect x="68" y="290" width="6" height="78" rx="3" fill="#5f86c4"/>
  <text x="92" y="318" class="lbl">AWS Terrarium ~30 m — globalny SRTM</text>
  <text x="92" y="342" class="txt">Wysokość zakodowana w RGB (kafle PNG), dekodowana na CPU. Fallback poza PL.</text>
  <rect x="606" y="300" width="138" height="26" rx="13" fill="#2a3c5c"/>
  <text x="675" y="318" text-anchor="middle" class="badge" fill="#a9c2e8">FALLBACK · świat</text>

  <!-- Combine -->
  <line x1="412" y1="368" x2="412" y2="392" class="arrow"/>
  <rect x="68" y="396" width="688" height="64" rx="10" fill="#13243c" stroke="#34507a" stroke-width="1.5"/>
  <text x="92" y="422" class="lbl">CompositeDemSource — Strategy / Chain of Responsibility</text>
  <text x="92" y="446" class="txt">PL → 1 m, poza zasięgiem → 30 m. Wspólny IDemTileSource, kafle XYZ.</text>

  <!-- Tiling + texture -->
  <rect x="68" y="474" width="335" height="92" rx="10" fill="#15233a" stroke="#2a4366" stroke-width="1.5"/>
  <text x="92" y="502" class="lbl">Streaming + cache</text>
  <text x="92" y="526" class="txt">Slippy XYZ, shared-origin</text>
  <text x="92" y="548" class="txt">projection, cache na urządzeniu.</text>

  <rect x="421" y="474" width="335" height="92" rx="10" fill="#15233a" stroke="#2a4366" stroke-width="1.5"/>
  <text x="445" y="502" class="lbl">Tekstura</text>
  <text x="445" y="526" class="txt">Ortofotomapa GUGiK (WMTS)</text>
  <text x="445" y="548" class="txt">nałożona na mesh.</text>

  <!-- ============ PANEL 02 — RENDERING ============ -->
  <rect x="815" y="130" width="745" height="455" rx="14" class="panel"/>
  <text x="843" y="178" class="pnum">02</text>
  <text x="883" y="178" class="ph">Wpływ na renderowanie</text>

  <!-- big stat -->
  <rect x="843" y="200" width="688" height="86" rx="10" fill="#16304a" stroke="#2f6b52" stroke-width="1.5"/>
  <text x="867" y="244" font-size="40" font-weight="700" fill="url(#snow)">30 m → 1 m</text>
  <text x="1120" y="232" class="lbl">do ~900× gęstsza siatka /km²</text>
  <text x="1120" y="258" class="txt">(≈1,1 tys. → ≈1 mln próbek na km²)</text>

  <g>
    <circle cx="858" cy="318" r="4" fill="#3fd0a0"/>
    <text x="876" y="324" class="lbl">Mesh: dynamiczny LOD + streaming kafli</text>
    <text x="876" y="346" class="txt">tile planner + frustum culling → budżet trójkątów stały mimo 1 m.</text>

    <circle cx="858" cy="378" r="4" fill="#3fd0a0"/>
    <text x="876" y="384" class="lbl">GPU: SKGLView · OpenGL ES 3.0</text>
    <text x="876" y="406" class="txt">per-pixel Lambert + fog (aerial perspective) + cień chmur, jeden pass.</text>

    <circle cx="858" cy="438" r="4" fill="#3fd0a0"/>
    <text x="876" y="444" class="lbl">Shadery fizyczne zyskują na detalu 1 m</text>
    <text x="876" y="466" class="txt">śnieg wg stoku/ekspozycji/wysokości · mapa nachylenia (8 pasm) · atmosfera wg pory dnia.</text>

    <circle cx="858" cy="498" r="4" fill="#e8b84b"/>
    <text x="876" y="504" class="lbl">Koszt: pasmo i pamięć</text>
    <text x="876" y="526" class="txt">kafle 1 m tylko przy zoomie · dekod Terrarium na CPU · per-region download (nie w APK).</text>

    <circle cx="858" cy="558" r="4" fill="#3fd0a0"/>
    <text x="876" y="564" class="lbl">Efekt: ostre granie, żleby, urwiska — i wierniejsza ocena lawinowa.</text>
  </g>

  <!-- ============ PANEL 03 — PORÓWNANIE ============ -->
  <rect x="40" y="612" width="1520" height="368" rx="14" class="panel"/>
  <text x="68" y="660" class="pnum">03</text>
  <text x="108" y="660" class="ph">Porównanie z topowymi rozwiązaniami mobilnymi</text>

  <!-- column headers -->
  <g class="row0">
    <text x="70" y="706">Aplikacja</text>
    <text x="372" y="706" text-anchor="middle">DEM / źródło</text>
    <text x="640" y="706" text-anchor="middle">3D mesh GPU</text>
    <text x="830" y="706" text-anchor="middle">Mapa lawinowa</text>
    <text x="1030" y="706" text-anchor="middle">Śnieg fizyczny</text>
    <text x="1230" y="706" text-anchor="middle">Offline PL</text>
    <text x="1420" y="706" text-anchor="middle">Pora dnia</text>
  </g>
  <line x1="68" y1="718" x2="1532" y2="718" stroke="#2f4d72" stroke-width="1.5"/>

  <!-- MapaTur highlighted -->
  <rect x="60" y="728" width="1480" height="44" rx="8" fill="#16304a" stroke="#3fd0a0" stroke-width="1.5"/>
  <text x="74" y="757" class="lbl" fill="#7df0c4">MapaTur</text>
  <text x="372" y="757" text-anchor="middle" class="ok">1 m LiDAR ✓</text>
  <text x="640" y="757" text-anchor="middle" class="ok">✓</text>
  <text x="830" y="757" text-anchor="middle" class="ok">✓ 8 pasm</text>
  <text x="1030" y="757" text-anchor="middle" class="ok">✓ stok+ekspoz</text>
  <text x="1230" y="757" text-anchor="middle" class="ok">✓ per-region</text>
  <text x="1420" y="757" text-anchor="middle" class="ok">✓ atmosfera</text>

  <!-- FATMAP -->
  <text x="74" y="809" class="cell" font-weight="700" fill="#dce7f6">FATMAP (Strava)</text>
  <text x="372" y="809" text-anchor="middle" class="cell">~10–30 m</text>
  <text x="640" y="809" text-anchor="middle" class="ok">✓</text>
  <text x="830" y="809" text-anchor="middle" class="mid">~ slope</text>
  <text x="1030" y="809" text-anchor="middle" class="no">✗</text>
  <text x="1230" y="809" text-anchor="middle" class="mid">~</text>
  <text x="1420" y="809" text-anchor="middle" class="no">✗</text>
  <line x1="68" y1="826" x2="1532" y2="826" stroke="#22364f" stroke-width="1"/>

  <!-- PeakVisor -->
  <text x="74" y="858" class="cell" font-weight="700" fill="#dce7f6">PeakVisor</text>
  <text x="372" y="858" text-anchor="middle" class="cell">~30 m</text>
  <text x="640" y="858" text-anchor="middle" class="ok">✓</text>
  <text x="830" y="858" text-anchor="middle" class="no">✗</text>
  <text x="1030" y="858" text-anchor="middle" class="no">✗</text>
  <text x="1230" y="858" text-anchor="middle" class="ok">✓</text>
  <text x="1420" y="858" text-anchor="middle" class="mid">~ słońce</text>
  <line x1="68" y1="875" x2="1532" y2="875" stroke="#22364f" stroke-width="1"/>

  <!-- Google Earth -->
  <text x="74" y="907" class="cell" font-weight="700" fill="#dce7f6">Google Earth</text>
  <text x="372" y="907" text-anchor="middle" class="cell">~30 m (PL)</text>
  <text x="640" y="907" text-anchor="middle" class="ok">✓</text>
  <text x="830" y="907" text-anchor="middle" class="no">✗</text>
  <text x="1030" y="907" text-anchor="middle" class="no">✗</text>
  <text x="1230" y="907" text-anchor="middle" class="no">✗</text>
  <text x="1420" y="907" text-anchor="middle" class="no">✗</text>
  <line x1="68" y1="924" x2="1532" y2="924" stroke="#22364f" stroke-width="1"/>

  <!-- Mapy.cz / Gaia -->
  <text x="74" y="956" class="cell" font-weight="700" fill="#dce7f6">Mapy.cz / Gaia GPS</text>
  <text x="372" y="956" text-anchor="middle" class="cell">2D relief (LiDAR PL)</text>
  <text x="640" y="956" text-anchor="middle" class="no">✗</text>
  <text x="830" y="956" text-anchor="middle" class="mid">~</text>
  <text x="1030" y="956" text-anchor="middle" class="no">✗</text>
  <text x="1230" y="956" text-anchor="middle" class="ok">✓</text>
  <text x="1420" y="956" text-anchor="middle" class="no">✗</text>

  <!-- Footer -->
  <text x="40" y="1012" class="foot">Edge MapaTur: jedyna z 1 m LiDAR PL w pełnym GPU-mesh 3D + fizyczny model śniegu/lawin sterowany pora dnia.</text>
  <text x="40" y="1036" class="foot">Dane konkurencji orientacyjne (publiczne). Stack: .NET 10 · MAUI · SkiaSharp/SKGLView · OpenGL ES 3.0 · GUGiK WCS/WMTS · AWS Terrarium.</text>
</svg>
