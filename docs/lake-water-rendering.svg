<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0f1c2f"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="1" stop-color="#142a44"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8f2"/>
      <stop offset="1" stop-color="#6f9ec4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa0a8"/>
      <stop offset="0.5" stop-color="#1c6f86"/>
      <stop offset="1" stop-color="#0a1f36"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef5"/>
      <stop offset="0.45" stop-color="#7d8aa0"/>
      <stop offset="1" stop-color="#3b4a63"/>
    </linearGradient>
    <linearGradient id="rockm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26405f"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <linearGradient id="fres" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1f36"/>
      <stop offset="0.5" stop-color="#1c6f86"/>
      <stop offset="1" stop-color="#bcd8f2"/>
    </linearGradient>
    <style>
      .h1{fill:#f1f7fc;font-size:38px;font-weight:700}
      .sub{fill:#86a6c6;font-size:19px}
      .panel{fill:#13233a;stroke:#284a6b;stroke-width:1.5}
      .ph{fill:#cfe6f5;font-size:24px;font-weight:700}
      .pnum{fill:#46c8e0;font-size:24px;font-weight:700}
      .lbl{fill:#e7f0fb;font-size:19px;font-weight:600}
      .txt{fill:#9bb6d2;font-size:16.5px}
      .badge{font-size:13.5px;font-weight:700}
      .ok{fill:#46d6b0;font-size:18px;font-weight:700}
      .mid{fill:#e8b84b;font-size:18px;font-weight:700}
      .foot{fill:#7991ac;font-size:15px}
      .chip{fill:#16304c;stroke:#2c5176;stroke-width:1}
      .arrow{stroke:#46c8e0;stroke-width:2.5;fill:none;marker-end:url(#ah)}
      .ray{stroke:#f0c24a;stroke-width:2;fill:none;opacity:.9}
      .rayr{stroke:#7ad6ff;stroke-width:2.5;fill:none;marker-end:url(#ar)}
      .rayt{stroke:#46d6b0;stroke-width:2.5;fill:none;stroke-dasharray:6 4;marker-end:url(#at)}
      .sun{stroke:#ff9d3d;stroke-width:2.5;fill:none;marker-end:url(#as)}
      .sunr{stroke:#ff9d3d;stroke-width:3;fill:none;marker-end:url(#as)}
      .code{font-family:Consolas,monospace;fill:#a9e6ff;font-size:14.5px}
      .mono{font-family:Consolas,monospace;fill:#cfe6f5;font-size:15px;font-weight:700}
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#46c8e0"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7ad6ff"/></marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#46d6b0"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ff9d3d"/></marker>
  </defs>

  <rect width="1600" height="1180" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="104" fill="url(#hdr)"/>
  <rect x="0" y="100" width="1600" height="4" fill="#46c8e0"/>
  <text x="40" y="50" class="h1">LAKE WATER &#8212; PLANAR REFLECTION + DEPTH-TINTED GLASS</text>
  <text x="40" y="84" class="sub">Real OSM lake outlines on the 3D terrain &#183; reflection, transparency &amp; Fresnel computed per-pixel &#183; OpenGL ES 3.0 on SKGLView</text>
  <rect x="1306" y="30" width="254" height="44" rx="22" class="chip"/>
  <text x="1433" y="59" text-anchor="middle" class="badge" fill="#7ad6ff">MIRROR + SEE-THROUGH</text>

  <!-- ============ HERO: CAMERA + LAKE + RAYS ============ -->
  <rect x="40" y="130" width="1010" height="450" rx="14" class="panel"/>
  <text x="68" y="176" class="pnum">IDEA</text>
  <text x="132" y="176" class="ph">The surface is TWO images mixed by the view angle</text>

  <!-- camera -->
  <rect x="120" y="212" width="78" height="52" rx="9" fill="#0e1b2c" stroke="#46c8e0" stroke-width="2"/>
  <rect x="150" y="200" width="30" height="16" rx="4" fill="#0e1b2c" stroke="#46c8e0" stroke-width="2"/>
  <circle cx="159" cy="238" r="14" fill="#10293f" stroke="#7ad6ff" stroke-width="2"/>
  <circle cx="159" cy="238" r="6" fill="#7ad6ff"/>
  <text x="159" y="292" text-anchor="middle" class="lbl">CAMERA</text>

  <!-- mountain (above water) -->
  <path d="M560,470 L700,250 L770,330 L840,210 L980,470 Z" fill="url(#rock)" stroke="#5a6b85" stroke-width="1.5"/>
  <!-- water plane -->
  <rect x="300" y="470" width="700" height="74" fill="url(#water)" opacity="0.92"/>
  <line x1="300" y1="470" x2="1000" y2="470" stroke="#9fe0ef" stroke-width="2" opacity="0.7"/>
  <text x="312" y="492" class="mono" fill="#dff3ff">WATER PLANE  z = lake elevation (OSM &#8216;ele&#8217;)</text>
  <!-- mirrored ghost mountain (planar reflection) below the plane -->
  <path d="M560,544 L700,720 L770,656 L840,734 L980,544 Z" fill="#1b3148" opacity="0.55"/>
  <path d="M560,544 L700,720 L770,656 L840,734 L980,544 Z" fill="none" stroke="#3b5b7e" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="770" y="690" text-anchor="middle" class="txt" fill="#7ea6c8">mirrored terrain (reflection pre-pass)</text>

  <!-- GRAZING point (far, left) -->
  <line x1="198" y1="240" x2="380" y2="470" class="ray"/>
  <line x1="380" y1="470" x2="690" y2="262" class="rayr"/>
  <line x1="380" y1="455" x2="380" y2="420" class="arrow"/>
  <text x="356" y="412" class="txt" fill="#9fe0ef">n</text>
  <circle cx="380" cy="470" r="4" fill="#f0c24a"/>
  <rect x="300" y="256" width="250" height="46" rx="9" fill="#10293f" stroke="#2c5176"/>
  <text x="312" y="276" class="lbl" fill="#7ad6ff">grazing angle</text>
  <text x="312" y="295" class="txt">high Fresnel &#8594; acts like a MIRROR</text>

  <!-- FACE-ON point (near, right) -->
  <line x1="198" y1="244" x2="820" y2="512" class="ray"/>
  <line x1="820" y1="512" x2="820" y2="610" class="rayt"/>
  <line x1="820" y1="500" x2="820" y2="468" class="arrow"/>
  <circle cx="820" cy="512" r="4" fill="#f0c24a"/>
  <rect x="700" y="556" width="300" height="46" rx="9" fill="#0d2233" stroke="#2c5176"/>
  <text x="712" y="576" class="lbl" fill="#46d6b0">looking more straight down</text>
  <text x="712" y="595" class="txt">low Fresnel &#8594; SEE INTO the depth-tinted water</text>

  <!-- SUN + GLINT (the next feature: specular reflection of the sun toward the eye) -->
  <!-- sun disc + rays -->
  <circle cx="890" cy="150" r="22" fill="#ffd34d"/>
  <circle cx="890" cy="150" r="22" fill="none" stroke="#ffb02e" stroke-width="2.5"/>
  <g stroke="#ffd34d" stroke-width="3" stroke-linecap="round">
    <line x1="890" y1="116" x2="890" y2="104"/>
    <line x1="890" y1="184" x2="890" y2="196"/>
    <line x1="856" y1="150" x2="844" y2="150"/>
    <line x1="924" y1="150" x2="936" y2="150"/>
    <line x1="866" y1="126" x2="857" y2="117"/>
    <line x1="914" y1="174" x2="923" y2="183"/>
    <line x1="866" y1="174" x2="857" y2="183"/>
    <line x1="914" y1="126" x2="923" y2="117"/>
  </g>
  <text x="890" y="208" text-anchor="middle" class="lbl" fill="#ffd34d">SUN</text>
  <!-- incoming sun ray down to the glint point -->
  <line x1="872" y1="163" x2="484" y2="460" class="sun"/>
  <!-- surface normal at the glint -->
  <line x1="470" y1="470" x2="470" y2="414" stroke="#9fe0ef" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="478" y="430" class="txt" fill="#9fe0ef">n</text>
  <!-- equal angles (law of reflection): incoming vs normal == normal vs reflected -->
  <path d="M470,444 A26,26 0 0 1 491,454" fill="none" stroke="#9fe0ef" stroke-width="1.4"/>
  <path d="M470,444 A26,26 0 0 0 449,454" fill="none" stroke="#9fe0ef" stroke-width="1.4"/>
  <!-- reflected ray to the camera = the glint you actually see -->
  <line x1="470" y1="470" x2="192" y2="256" class="sunr"/>
  <!-- glint starburst -->
  <g stroke="#fff1c2" stroke-width="2.5" stroke-linecap="round">
    <line x1="470" y1="454" x2="470" y2="486"/>
    <line x1="454" y1="470" x2="486" y2="470"/>
    <line x1="459" y1="459" x2="481" y2="481"/>
    <line x1="481" y1="459" x2="459" y2="481"/>
  </g>
  <circle cx="470" cy="470" r="5" fill="#fff1c2"/>
  <text x="384" y="505" class="txt" fill="#ffd9a0">glint &#8594; eye</text>

  <!-- legend of rays -->
  <g transform="translate(70,524)">
    <line x1="0" y1="0" x2="30" y2="0" class="ray"/><text x="38" y="5" class="txt">view ray</text>
    <line x1="150" y1="0" x2="180" y2="0" class="rayr"/><text x="188" y="5" class="txt">reflection (mirror about plane)</text>
  </g>
  <g transform="translate(70,548)">
    <line x1="0" y1="0" x2="30" y2="0" class="rayt"/><text x="38" y="5" class="txt">transparency (into water &#8594; depth tint)</text>
    <line x1="430" y1="0" x2="460" y2="0" class="sun"/><text x="470" y="5" class="txt">sun ray &amp; glint (specular)</text>
  </g>

  <!-- ============ RIGHT: WATER LAYERS ============ -->
  <rect x="1066" y="130" width="494" height="450" rx="14" class="panel"/>
  <text x="1094" y="176" class="ph">Per-pixel layers</text>

  <!-- layer card template -->
  <g>
    <rect x="1094" y="196" width="438" height="62" rx="9" fill="#10293f" stroke="#2f6b6f" stroke-width="1.5"/>
    <rect x="1094" y="196" width="6" height="62" rx="3" fill="#7ad6ff"/>
    <text x="1116" y="222" class="lbl">1 &#183; Reflection (sky + mirrored peaks)</text>
    <text x="1116" y="245" class="txt">sampled from the pre-pass texture, water-blue tint</text>
  </g>
  <g>
    <rect x="1094" y="266" width="438" height="62" rx="9" fill="#0d2233" stroke="#3a4d6b" stroke-width="1.5"/>
    <rect x="1094" y="266" width="6" height="62" rx="3" fill="#f0c24a"/>
    <text x="1116" y="292" class="lbl">2 &#183; Fresnel mix (by view&#183;normal)</text>
    <text x="1116" y="315" class="txt">pow(1&#8722;dot,4), floor 0.22 &#8594; reflection vs. depth</text>
  </g>
  <g>
    <rect x="1094" y="336" width="438" height="62" rx="9" fill="#0d2233" stroke="#3a4d6b" stroke-width="1.5"/>
    <rect x="1094" y="336" width="6" height="62" rx="3" fill="#2fae9a"/>
    <text x="1116" y="362" class="lbl">3 &#183; Depth tint (turquoise &#8594; navy)</text>
    <text x="1116" y="385" class="txt">radial from lake centre (uLakeCenter / uLakeRadius)</text>
  </g>
  <g>
    <rect x="1094" y="406" width="438" height="62" rx="9" fill="#0d2233" stroke="#3a4d6b" stroke-width="1.5"/>
    <rect x="1094" y="406" width="6" height="62" rx="3" fill="#9fe0ef"/>
    <text x="1116" y="432" class="lbl">4 &#183; Ripple normal (animated)</text>
    <text x="1116" y="455" class="txt">value-noise tilt wobbles normal + reflection UV</text>
  </g>
  <g>
    <rect x="1094" y="476" width="438" height="62" rx="9" fill="#0d2233" stroke="#3a4d6b" stroke-width="1.5"/>
    <rect x="1094" y="476" width="6" height="62" rx="3" fill="#e8b84b"/>
    <text x="1116" y="502" class="lbl">5 &#183; Sun glint (specular)</text>
    <text x="1116" y="525" class="txt">Blinn-Phong off ripple normal, emitted after light</text>
    <rect x="1454" y="484" width="70" height="24" rx="12" fill="#0e323a"/>
    <text x="1489" y="501" text-anchor="middle" class="badge" fill="#46d6b0">NEXT</text>
  </g>

  <!-- ============ HOW IT WORKS (PER FRAME / PER PIXEL) ============ -->
  <text x="40" y="624" class="ph" fill="#cfe6f5">HOW IT WORKS</text>
  <text x="232" y="624" class="sub">per frame &#8594; per pixel</text>

  <!-- step 1 -->
  <rect x="40" y="640" width="292" height="226" rx="12" class="panel"/>
  <circle cx="70" cy="676" r="13" fill="#0e2b2f" stroke="#46d6b0" stroke-width="2"/><text x="70" y="682" text-anchor="middle" class="ok">1</text>
  <text x="94" y="682" class="lbl">Build the mesh</text>
  <text x="60" y="716" class="txt">OSM &#8216;natural=water&#8217; outline</text>
  <text x="60" y="738" class="txt">&#8594; ear-clip into flat,</text>
  <text x="60" y="760" class="txt">non-overlapping triangles</text>
  <text x="60" y="782" class="txt">at the lake&#8217;s own elevation.</text>
  <text x="60" y="820" class="code">EarClipXy(ring)</text>
  <text x="60" y="844" class="txt" fill="#7991ac">one flat plane per lake</text>

  <!-- step 2 -->
  <rect x="348" y="640" width="292" height="226" rx="12" class="panel"/>
  <circle cx="378" cy="676" r="13" fill="#0e2b2f" stroke="#46d6b0" stroke-width="2"/><text x="378" y="682" text-anchor="middle" class="ok">2</text>
  <text x="402" y="682" class="lbl">Reflection pre-pass</text>
  <text x="368" y="716" class="txt">Render the terrain MIRRORED</text>
  <text x="368" y="738" class="txt">about the lake plane into a</text>
  <text x="368" y="760" class="txt">half-res FBO; discard every</text>
  <text x="368" y="782" class="txt">fragment below the waterline.</text>
  <text x="368" y="820" class="code">z &#8594; 2&#183;waterZ &#8722; z</text>
  <text x="368" y="844" class="txt" fill="#7991ac">= the peaks, upside-down</text>

  <!-- step 3 -->
  <rect x="656" y="640" width="292" height="226" rx="12" class="panel"/>
  <circle cx="686" cy="676" r="13" fill="#0e2b2f" stroke="#46d6b0" stroke-width="2"/><text x="686" y="682" text-anchor="middle" class="ok">3</text>
  <text x="710" y="682" class="lbl">Draw the water</text>
  <text x="676" y="716" class="txt">Blended over the terrain.</text>
  <text x="676" y="738" class="txt">Depth-test ON (the basin</text>
  <text x="676" y="760" class="txt">clips it); depth-WRITE ON so</text>
  <text x="676" y="782" class="txt">coplanar tris blend ONCE.</text>
  <text x="676" y="820" class="code">DepthFunc = Less</text>
  <text x="676" y="844" class="txt" fill="#7991ac">kills double-blend seams</text>

  <!-- step 4 -->
  <rect x="964" y="640" width="292" height="226" rx="12" class="panel"/>
  <circle cx="994" cy="676" r="13" fill="#0e2b2f" stroke="#46d6b0" stroke-width="2"/><text x="994" y="682" text-anchor="middle" class="ok">4</text>
  <text x="1018" y="682" class="lbl">Mix per pixel</text>
  <text x="984" y="716" class="txt">Fresnel(view, ripple-normal)</text>
  <text x="984" y="738" class="txt">blends the depth-tinted bottom</text>
  <text x="984" y="760" class="txt">with the reflection sampled in</text>
  <text x="984" y="782" class="txt">screen space + ripple wobble.</text>
  <text x="984" y="820" class="code">mix(bottom, refl, F)</text>
  <text x="984" y="844" class="txt" fill="#7991ac">smooth, no vertex creases</text>

  <!-- step 5 -->
  <rect x="1272" y="640" width="288" height="226" rx="12" class="panel"/>
  <circle cx="1302" cy="676" r="13" fill="#0e2b2f" stroke="#46d6b0" stroke-width="2"/><text x="1302" y="682" text-anchor="middle" class="ok">5</text>
  <text x="1326" y="682" class="lbl">Transparency</text>
  <text x="1292" y="716" class="txt">Alpha rises with depth:</text>
  <text x="1292" y="738" class="txt">glassy &amp; see-through at the</text>
  <text x="1292" y="760" class="txt">shore, more opaque in the</text>
  <text x="1292" y="782" class="txt">deep centre.</text>
  <text x="1292" y="820" class="code">a = mix(0.15, 0.60, depth)</text>
  <text x="1292" y="844" class="txt" fill="#7991ac">shore reads as real water</text>

  <!-- ============ BOTTOM ROW: OPENGL / FRESNEL / CONSTRAINT ============ -->
  <!-- OpenGL panel -->
  <rect x="40" y="886" width="640" height="256" rx="12" class="panel"/>
  <text x="68" y="926" class="pnum">GL</text>
  <text x="110" y="926" class="ph">How OpenGL ES does it</text>
  <circle cx="80" cy="962" r="4" fill="#46c8e0"/><text x="98" y="968" class="lbl">FBO pre-pass</text>
  <text x="98" y="990" class="txt">two passes: terrain mirrored into a texture, then the real view.</text>
  <circle cx="80" cy="1018" r="4" fill="#46c8e0"/><text x="98" y="1024" class="lbl">Screen-space sample</text>
  <text x="98" y="1046" class="txt">reflection read at gl_FragCoord.xy / viewport (TextureUnit 1; ortho on 0).</text>
  <circle cx="80" cy="1074" r="4" fill="#46c8e0"/><text x="98" y="1080" class="lbl">Single coverage, no stencil</text>
  <text x="98" y="1102" class="txt">no stencil in GLES &#8594; depth-write + DepthFunc Less = one blend per pixel.</text>
  <text x="98" y="1126" class="txt" fill="#7991ac">drawn into the Skia-owned FBO, own GL state each frame, ResetContext after.</text>

  <!-- Fresnel / camera mini -->
  <rect x="696" y="886" width="430" height="256" rx="12" class="panel"/>
  <text x="724" y="926" class="ph">Camera &#8594; Fresnel</text>
  <text x="724" y="958" class="txt">The angle between the view ray and</text>
  <text x="724" y="980" class="txt">the surface normal decides the mix:</text>
  <rect x="724" y="998" width="374" height="22" rx="6" fill="url(#fres)"/>
  <text x="724" y="1044" class="txt" fill="#9fe0ef">face-on</text>
  <text x="1098" y="1044" text-anchor="end" class="txt" fill="#dff3ff">grazing</text>
  <text x="724" y="1072" class="txt">left: see into water (depth tint).</text>
  <text x="724" y="1094" class="txt">right: mirror of sky + peaks.</text>
  <text x="724" y="1124" class="txt" fill="#7991ac">reflection = view ray mirrored about the flat water plane.</text>

  <!-- Parameters + constraint -->
  <rect x="1142" y="886" width="418" height="256" rx="12" class="panel"/>
  <text x="1170" y="926" class="ph">Parameters</text>
  <text x="1170" y="958" class="code">water z = OSM ele + 4 m lift</text>
  <text x="1170" y="982" class="code">Fresnel = pow(1&#8722;cos, 4), floor 0.22</text>
  <text x="1170" y="1006" class="code">reflection FBO = half resolution</text>
  <text x="1170" y="1030" class="code">blue tint over mirror = 0.10</text>
  <text x="1170" y="1054" class="code">alpha = 0.15 (shore) .. 0.60 (deep)</text>
  <rect x="1170" y="1074" width="362" height="52" rx="9" fill="#2a1f12" stroke="#6b5320" stroke-width="1.5"/>
  <text x="1186" y="1096" class="lbl" fill="#e8b84b">&#9888; Only a 1 m slice (LOD demo) so far</text>
  <text x="1186" y="1118" class="txt" fill="#d8c089">one shared reflection plane (Morskie Oko); per-lake planes + wider coverage = next.</text>

  <!-- Footer -->
  <text x="40" y="1166" class="foot">Pipeline: OSM outline &#8594; ear-clip mesh &#8594; mirrored reflection FBO &#8594; per-pixel Fresnel(depth-tint, reflection) + depth-driven alpha. Sun glint = next step. Stack: .NET 10 MAUI &#183; SkiaSharp / SKGLView &#183; OpenGL ES 3.0.</text>
</svg>
